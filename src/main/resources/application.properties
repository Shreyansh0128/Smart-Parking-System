spring.config.import=optional:file:./application-local.properties
server.address=127.0.0.1
spring.datasource.url=jdbc:oracle:thin:@//localhost:1521/xe
spring.datasource.username=parking_app
spring.datasource.password=${PARKING_DB_PASSWORD:${parking.db.password:}}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.hikari.connection-init-sql=ALTER SESSION SET TIME_ZONE='UTC'
spring.jackson.time-zone=UTC
parking.billing.hourly-rate=2.00
parking.notifications.upcoming-minutes=15
parking.notifications.unknown-reminder-minutes=60
parking.notifications.poll-interval-ms=60000
